name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 배포는 한 번에 하나만. 연달아 push해도 순서가 꼬이지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 게이트를 CI에 둔다 — 이전 프로젝트는 lint 명령이 있는데 CI에 없어서
      # 오류 71건이 쌓인 채 배포되고 있었다.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # OpenAPI 명세는 생성물이다. 제안서나 타입만 고치고 다시 안 만들면
      # 백엔드가 받는 파일이 조용히 낡는다 — 여기서 막는다.
      - run: npm run api:spec
      - name: 생성한 명세가 커밋된 것과 같은지
        run: git diff --exit-code -- docs/api
      - run: npm run build
      # E2E는 preview 빌드를 띄워 돌린다(playwright.config.ts 참조).
      # 브라우저 설치는 CI에서만 필요하다.
      - run: npx playwright install --with-deps chromium

      # 기능과 접근성을 **다른 step으로** 나눈다. 한 덩어리면 CI가 빨개졌을 때
      # 로그를 열어야 어느 쪽인지 알 수 있다 — step 이름이 그 답을 대신한다.
      #
      # 잡(job)으로 나누지 않은 이유: 실측으로 접근성 20건은 10초, 기능 274건은
      # 58초다. 잡을 나누면 checkout·npm ci·build·preview·브라우저 설치가 한 번
      # 더 돌아 2~3분이 늘어난다. 10초를 병렬로 벌자고 3분을 더 쓰는 셈이다.
      #
      # 두 step의 `--grep`과 `--grep-invert`는 **같은 태그**를 쓴다. 그래서 어떤
      # 테스트도 양쪽에서 다 빠질 수 없다 — 태그를 안 붙인 새 테스트는 기능 쪽으로
      # 간다(안 도는 게 아니라). '안 본 화면이 통과한 화면처럼 보이는' 상태를 막는다.
      # 지금은 두 명령이 서로의 여집합이라 구멍이 날 수 없다. 하지만 누군가
      # `--grep`을 다른 태그로 바꾸면 그 순간 조용히 빠지는 테스트가 생긴다.
      # 그래서 '두 몫의 합이 전체와 같은가'를 먼저 센다.
      - name: 두 몫이 전체를 덮는지
        run: |
          count() { npx playwright test "$@" --list | sed -n 's/^Total: \([0-9]*\).*/\1/p'; }
          A=$(count --grep @a11y)
          B=$(count --grep-invert @a11y)
          T=$(count)
          echo "접근성 $A + 기능 $B = $((A+B)) / 전체 $T"
          [ "$((A+B))" -eq "$T" ] || { echo "::error::어느 몫에도 안 들어간 테스트 $((T-A-B))건"; exit 1; }

      - name: E2E — 기능
        run: npm run e2e:app
      # `if: always()`가 없으면 기능이 깨진 커밋의 접근성은 통과도 실패도 아닌
      # **'안 봄'**이 된다 — 그런데 화면에는 빨간 verify 하나만 남아서
      # 안 본 것이 안 보인다. 이 저장소가 가장 싫어하는 상태다.
      # 앞 step이 실패해도 돌리고, 결과는 그대로 잡의 성패에 반영된다.
      - name: E2E — 접근성 (axe · 훑기 · 낭독기 재료)
        if: always()
        run: npm run e2e:a11y

      # verify가 만든 dist를 그대로 배포한다 — 다시 빌드하면 검증한 것과
      # 다른 산출물이 나갈 수 있다.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # 배포는 verify 뒤에만 온다. lint·타입·테스트·E2E를 통과하지 못한 산출물은
  # 라이브로 나가지 않는다.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
