name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 게이트를 CI에 둔다 — 이전 프로젝트는 lint 명령이 있는데 CI에 없어서
      # 오류 71건이 쌓인 채 배포되고 있었다.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
