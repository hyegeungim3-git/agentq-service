name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 배포는 한 번에 하나만. 연달아 push해도 순서가 꼬이지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 게이트를 CI에 둔다 — 이전 프로젝트는 lint 명령이 있는데 CI에 없어서
      # 오류 71건이 쌓인 채 배포되고 있었다.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # OpenAPI 명세는 생성물이다. 제안서나 타입만 고치고 다시 안 만들면
      # 백엔드가 받는 파일이 조용히 낡는다 — 여기서 막는다.
      - run: npm run api:spec
      - name: 생성한 명세가 커밋된 것과 같은지
        run: git diff --exit-code -- docs/api
      - run: npm run build
      # E2E는 preview 빌드를 띄워 돌린다(playwright.config.ts 참조).
      # 브라우저 설치는 CI에서만 필요하다.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      # verify가 만든 dist를 그대로 배포한다 — 다시 빌드하면 검증한 것과
      # 다른 산출물이 나갈 수 있다.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # 배포는 verify 뒤에만 온다. lint·타입·테스트·E2E를 통과하지 못한 산출물은
  # 라이브로 나가지 않는다.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
