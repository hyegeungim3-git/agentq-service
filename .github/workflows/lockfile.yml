name: lockfile 재생성

# 개발 머신이 Windows라서 여기서 만든 package-lock.json은 Linux 설치에 필요한
# 항목이 빠진다. npm은 현재 플랫폼에서 쓰이지 않는 패키지(@tailwindcss/oxide-wasm32-wasi 등)의
# 하위 의존성을 순회하지 않기 때문이다. 그 결과 CI에서 npm ci가
# "Missing: @emnapi/runtime@... from lock file"로 실패한다.
# --os/--cpu 옵션을 줘도 해결되지 않는다(실측).
#
# 그래서 lockfile은 CI와 같은 환경(Linux)에서 만들어 내려받아 커밋한다.
# 의존성을 추가·변경한 뒤에 한 번 돌리면 된다.
#
# 사용법:
#   gh workflow run lockfile.yml
#   gh run download <run-id> -n package-lock -D .
#   git add package-lock.json && git commit

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      # 여기서 npm ci가 통과해야 실제로 고쳐진 것이다. 통과 못 하면 실패로 남긴다.
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
