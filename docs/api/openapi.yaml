    ModelState:
      type: string
      enum:
        - running
        - stopped
      description: |-
        LLM 운영 — 모델·신뢰성·답변 품질.
        
        이 구역의 위험은 **효과를 숫자로 적어 두면 검증된 것처럼 보인다**는 점이다. '정확도 +18.4%'는 언제 무엇으로 잰 것인지 없으면 아무 뜻이 없다. 그래서 측정 결과에는 잰 시점과 표본 수를 함께 두고, **아직 안 잰 것은 `null`로 둔다.** `0`이나 `'-'`로 두면 효과가 없는 것으로 읽히고, 평균에 섞이면 평균이 무너진다.
