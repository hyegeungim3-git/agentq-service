        OCR의 실무 관심사는 '텍스트가 나왔다'가 아니라 두 가지다.   ① 어디를 못 읽었는가 — 신뢰도가 낮은 줄을 숨기면 잘못된 값이 그대로 흘러간다   ② 개인정보를 가렸는가 — 가렸다고 말만 하면 안 되고 무엇을 가렸는지 남겨야 한다
