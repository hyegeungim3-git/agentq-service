          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /knowledge/pipeline-runs:
    get:
      operationId: fetchPipelineRuns
      summary: "**단계별 들어온 수·나간 수·떨어진 사유**를 함께 — 최종 건수만 오면 고칠 곳을 못 찾는다"
      description: → `PipelineRun[]`. **단계별 들어온 수·나간 수·떨어진 사유**를 함께 — 최종 건수만 오면 고칠 곳을 못 찾는다
      tags:
        - knowledge
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineRun"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /agents/definitions:
    get:
      operationId: fetchAgentDefs
      summary: "**단계와 사람 확인 지점을 함께** — 능력 배지만 오면 '확인 없이 나가는 에이전트'를 그릴 수 없다"
      description: "→ `AgentDefinition[]` (`entities/agentdef/model.ts`). **단계와 사람 확인 지점을 함께** — 능력 배지만 오면 '확인 없이 나가는 에이전트'를 그릴 수 없다"
      tags:
        - agents
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentDefinition"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /agents/adopted:
    get:
      operationId: fetchAdoptedAgents
      summary: 이 발주처가 **도입한** 에이전트 id 목록
      description: "→ 이 발주처가 **도입한** 에이전트 id 목록. 카탈로그의 '아직 안 만든 화면'과 다른 축이다 — 화면은 있는데 이 발주처엔 안 들어온 것"
      tags:
        - agents
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /agents/definitions/{id}:
    put:
      operationId: saveAgentDef
      summary: 정의 변경 — 답이 달라지는 일이라 검토·되돌리기가 함께 필요하다
      description: 정의 변경 — 답이 달라지는 일이라 검토·되돌리기가 함께 필요하다
      tags:
        - agents
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /workflows:
    get:
      operationId: fetchWorkflows
      summary: "**탄 분기와 멈춘 노드를 함께** — 성공률만 오면 왜 실패했는지·안 타는 분기를 그릴 수 없다"
      description: → `Workflow[]` (`entities/workflow/model.ts`). **탄 분기와 멈춘 노드를 함께** — 성공률만 오면 왜 실패했는지·안 타는 분기를 그릴 수 없다
      tags:
