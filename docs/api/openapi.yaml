                items:
                  $ref: "#/components/schemas/mlops_Dataset"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /devenv/workspaces:
    get:
      operationId: fetchWorkspaces
      summary: GPU를 잡는 **개발 방**이다 — 포털의 업무 공간과 다른 자원
      description: → `Workspace[]` (`entities/mlops/model.ts`). GPU를 잡는 **개발 방**이다 — 포털의 업무 공간(`GET /workspaces`)과 다른 자원. 마지막 계산 시각(`lastActiveAt`)이 있어야 유휴를 잰다
      tags:
        - devenv
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/mlops_Workspace"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /devenv/workspaces/{id}:release:
    post:
      operationId: releaseWorkspace
      summary: 자원 회수
      description: 자원 회수
      tags:
        - devenv
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /models/versions:
    get:
      operationId: fetchModelVersions
      summary: "**계보**(·)를 함께 — 없으면 삭제 요청에 답할 수 없다"
      description: → `ModelVersion[]`. **계보**(`trainJobId`·`datasetIds`)를 함께 — 없으면 삭제 요청에 답할 수 없다
      tags:
        - models
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersion"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /training/runs:
    get:
      operationId: fetchTrainRuns
      summary: 트레이너 현황과 **같은 작업**의 상세다
      description: → `TrainRun[]`. 트레이너 현황(`/training/report`)과 **같은 작업**의 상세다
      tags:
        - training
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainRun"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /evaluations:
    get:
      operationId: fetchEvalResults
      summary: "**학습셋과 겹쳤는지**를 서버가 판정해 준다"
      description: → `EvalResult[]`. **학습셋과 겹쳤는지**(`trustworthy`)를 서버가 판정해 준다
      tags:
        - evaluations
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvalResult"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /integrations:
    get:
      operationId: fetchIntegrations
      summary: 끊기면 무엇이 멈추는지 필수
      description: → `Integration[]`. 끊기면 무엇이 멈추는지(`impactIfDown`) 필수
      tags:
        - integrations
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /training/report:
    get:
      operationId: fetchTrainerReport
      summary: =\|\| 
      description: "`window`=`day`\\|`week`\\|`month` → `TrainerReport`. 실패 작업에는 `note`(사유)가 있어야 한다"
      tags:
        - training
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainerReport"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: window
          in: query
          required: false
          schema:
            type: string
components:
  schemas:
    AccessLogEntry:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        ip:
          type: string
        result:
          $ref: "#/components/schemas/AccessResult"
        deniedReason:
          type:
            - string
            - "null"
          description: 거부됐으면 왜인지. 허용이면 null
      required:
        - id
        - at
        - actor
        - action
        - target
        - ip
        - result
        - deniedReason
      additionalProperties: false
    AccessResult:
      type: string
      enum:
        - ok
        - denied
    ActionItem:
      type: object
      properties:
        id:
          type: string
        task:
          type: string
        ownerId:
          type:
            - string
            - "null"
          description: 회의에서 정해지지 않았으면 null — 임의로 채우지 않는다
        due:
          type:
            - string
            - "null"
          description: ISO 날짜. 미정이면 null
      required:
        - id
        - task
        - ownerId
        - due
      additionalProperties: false
    AddressResolution:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/MappingStatus"
        confidence:
          type: number
          description: "0~1"
        roadAddress:
          type:
            - string
            - "null"
        jibunAddress:
          type:
            - string
            - "null"
        postalCode:
          type:
            - string
            - "null"
        legalCode:
          type:
            - string
            - "null"
          description: 법정동코드 10자리
        basis:
          type: array
          items:
            $ref: "#/components/schemas/MappingBasis"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
        blocker:
          type:
            - string
            - "null"
          description: 표준화하려면 무엇이 바뀌어야 하는지 (status가 none일 때)
      required:
        - status
        - confidence
        - roadAddress
        - jibunAddress
        - postalCode
        - legalCode
        - basis
        - alternatives
        - blocker
      additionalProperties: false
    AgendaCoverage:
      type: object
      properties:
        "no":
          type: number
        topic:
          type: string
        decisionIds:
          type: array
          items:
            type: string
      required:
        - "no"
        - topic
        - decisionIds
      additionalProperties: false
      description: 안건별 논의 여부 — 논의되지 않은 안건을 드러내는 것이 회의록의 실무 가치다
    AgentDefinition:
      type: object
      properties:
        agentId:
          $ref: "#/components/schemas/AgentId"
        code:
          type: string
        version:
          type: string
        purpose:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        responseMode:
          $ref: "#/components/schemas/ResponseMode"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"
        owner:
          type: string
      required:
        - agentId
        - code
        - version
        - purpose
        - capabilities
        - responseMode
        - steps
        - owner
      additionalProperties: false
    AgentId:
      type: string
      enum:
        - chatbot
        - report
        - meeting
        - knowledge
        - internalreg
        - ocr
        - dbquery
        - address
        - dataanalysis
        - summary
        - translate
        - review
        - safety
      description: |-
        에이전트 카탈로그.
        
        13종을 옮기는 중이므로 **구현 상태를 데이터로 들고 있는다.** 아직 안 만든 것을 목록에서 빼면 "원래 없던 기능"처럼 보이고, 그냥 넣어 두면 눌렀을 때 아무 일도 안 나는 죽은 버튼이 된다. 둘 다 피하려고 상태를 명시한다 — 화면이 '준비 중'으로 표시하고 비활성화한다.
    AgentOps:
      type: object
      properties:
        agentId:
          $ref: "#/components/schemas/AgentId"
        modelId:
          type: string
          description: 쓰는 모델 id (`entities/llmops`의 모델)
        modelName:
          type: string
        areaIds:
          type: array
          items:
            type: string
          description: 근거로 뒤지는 지식영역 id. 문서를 안 쓰면 빈 배열
        runs7d:
          type: number
        failed7d:
          type: number
        owner:
          type: string
        exposed:
          type: boolean
          description: 사용자 포털에 열려 있는가
      required:
        - agentId
        - modelId
        - modelName
        - areaIds
        - runs7d
        - failed7d
        - owner
        - exposed
      additionalProperties: false
    AiSystem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        dept:
          type: string
        verdict:
          $ref: "#/components/schemas/ImpactVerdict"
        reason:
          type: string
          description: 왜 그렇게 판정했는지 — 판정만 있고 근거가 없으면 다시 판단할 수 없다
        owner:
          type: string
        duties:
          type: array
          items:
            $ref: "#/components/schemas/DutyKey"
          description: 이행한 책무
        inService:
          type: boolean
          description: 운영 중인가 — 검토 중인데 돌고 있으면 그 사실을 드러내야 한다
      required:
        - id
        - name
        - dept
        - verdict
        - reason
        - owner
        - duties
        - inService
      additionalProperties: false
    Allocation:
      type: object
      properties:
        label:
          type: string
        ratio:
          type: number
      required:
        - label
        - ratio
      additionalProperties: false
      description: 자원 배분 — 합이 1이 되지 않을 수 있다. 남는 몫이 곧 여유다
    Alternative:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        confidence:
          type: number
        reason:
          type: string
          description: 왜 이게 1순위가 아닌지
      required:
        - code
        - name
        - confidence
        - reason
      additionalProperties: false
    AnalysisKind:
      type: string
      enum:
        - trend
        - distribution
      description: |-
        공정 데이터 분석 모델.
        
        분석의 위험은 **일부 데이터로 낸 결론을 전체 결론처럼 말하는 것**이다. 로트 키가 없는 데이터가 29%인데 "불량률은 0.42%입니다"라고만 하면, 담당자는 그 수치가 전수 기준인 줄 안다.
        
        그래서 결과에 coverage(적용률)와 제외 사유를 함께 담는다.
    AnalysisRequest:
      type: object
      properties:
        datasetId:
          type: string
        kind:
          $ref: "#/components/schemas/AnalysisKind"
      required:
        - datasetId
        - kind
      additionalProperties: false
    AnalysisResult:
      type: object
      properties:
        datasetId:
          type: string
        kind:
          $ref: "#/components/schemas/AnalysisKind"
        unit:
          type: string
          description: "실측값의 단위 — '%'·'℃'·'mm/s'. 데이터셋마다 다르므로 화면에 굳히지 않는다"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        distribution:
          type: array
          items:
            $ref: "#/components/schemas/DistributionBar"
        stats:
          type: array
          items:
            $ref: "#/components/schemas/StatRow"
        coverage:
          type: number
          description: 분석에 실제로 쓰인 데이터 비율 0~1
        excludedReasons:
          type: array
          items:
            type: string
          description: 왜 나머지가 빠졌는지 — 감추면 부분 결론이 전체 결론으로 읽힌다
        elapsedSeconds:
          type: number
      required:
        - datasetId
        - kind
        - unit
        - trend
        - distribution
        - stats
        - coverage
        - excludedReasons
        - elapsedSeconds
      additionalProperties: false
    ApiEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        version:
          type: string
        auth:
          type: string
        state:
          $ref: "#/components/schemas/ApiState"
        callsToday:
          type: number
        approvedOn:
          type: string
        note:
          type:
            - string
            - "null"
          description: 베타·중지면 왜인지
      required:
        - id
        - name
        - path
        - version
        - auth
        - state
        - callsToday
        - approvedOn
        - note
      additionalProperties: false
    ApiError:
      type: object
      required:
        - code
        - message
      additionalProperties: false
      description: 오류 본문. message는 사용자에게 그대로 보여 줄 수 있는 한국어 문장이어야 한다 — 화면이 다시 쓰지 않고 그대로 띄운다.
      properties:
        code:
          type: string
          description: 기계가 구분하는 코드. 목록은 백엔드가 정한다(§3-8)
        message:
          type: string
    ApiState:
      type: string
      enum:
        - active
        - beta
        - stopped
    AppInstance:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/AppKind"
        live:
          type: boolean
          description: 지금 사용자에게 열려 있는가
        downReason:
          type:
            - string
            - "null"
          description: 내려간 이유. 열려 있으면 null
        owner:
          type: string
        group:
          type: string
        uses7d:
          type: number
          description: 최근 7일 사용 건수
        createdOn:
          type: string
        areaIds:
          type: array
          items:
            type: string
          description: 이 앱이 기대는 지식영역 id
      required:
        - id
        - title
        - kind
        - live
        - downReason
        - owner
        - group
        - uses7d
        - createdOn
        - areaIds
      additionalProperties: false
    AppKind:
      type: string
      enum:
        - chat
        - report
        - analysis
      description: |-
        앱 인스턴스 · RAG 파이프라인.
        
        **애플리케이션 화면과 나누는 기준**: 저기는 '묶음'(사용자 포털·관리자·모바일), 여기는 사람들이 그 안에 만든 **개별 앱**이다. 묶음이 열려 있어도 개별 앱은 꺼져 있을 수 있다.
        
        **지식 관리 화면과 나누는 기준**: 저기는 결과(못 찾는 문서가 몇 건), 여기는 **어느 단계에서 떨어졌나**다. 결과만 보면 고칠 곳을 못 찾는다.
    AppSurface:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        audience:
          type: string
        live:
          type: boolean
          description: 지금 열려 있는가
        blockedReason:
          type:
            - string
            - "null"
          description: 못 여는 이유. 열려 있으면 null
        includes:
          type: array
          items:
            type: string
          description: 이 앱이 여는 화면
      required:
        - id
        - name
        - audience
        - live
        - blockedReason
        - includes
      additionalProperties: false
      description: 앱에 열어 준 것
    ApprovalKind:
      type: string
      enum:
        - signup
        - role
        - quota
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ApprovalKind"
        applicant:
          type: string
        dept:
          type: string
        requestedAt:
          type: string
        detail:
          type: string
          description: 무엇을 요청했는가 — 사람이 읽고 판단할 근거
        reason:
          type:
            - string
            - "null"
          description: 신청자가 적은 사유. 안 적었으면 null — 빈 문자열로 두면 적은 줄 안다
      required:
        - id
        - kind
        - applicant
        - dept
        - requestedAt
        - detail
        - reason
      additionalProperties: false
    Assessment:
      type: object
      properties:
        id:
          type: string
        systemName:
          type: string
        status:
          type: string
          enum:
            - done
            - ongoing
            - notStarted
        dueOn:
          type: string
        completedOn:
          type:
            - string
            - "null"
        remaining:
          type:
            - string
            - "null"
          description: 안 끝났으면 무엇이 남았는지
      required:
        - id
        - systemName
        - status
        - dueOn
        - completedOn
        - remaining
      additionalProperties: false
    AttendanceCheck:
      type: object
      properties:
        spoke:
          type: array
          items:
            type: string
        silent:
          type: array
          items:
            type: string
          description: 명단에 있지만 발언 기록이 없는 사람
        unlisted:
          type: array
          items:
            type: string
          description: 발언은 있는데 명단에 없는 사람
      required:
        - spoke
        - silent
        - unlisted
      additionalProperties: false
      description: 명단과 발언을 대조한 결과. 명단에 없는 발언자는 오인식이거나 기재되지 않은 참석자다 — 둘 다 확인해야 한다.
    AttributeMatch:
      type: object
      properties:
        label:
          type: string
        queryValue:
          type: string
          description: 검색 대상(신규 사양)의 값
        candidateValue:
          type: string
          description: 후보 도면의 값
        matched:
          type: boolean
      required:
        - label
        - queryValue
        - candidateValue
        - matched
      additionalProperties: false
      description: |-
        지식 검색 모델.
        
        검색의 값어치는 순위가 아니라 **왜 이게 걸렸는가**와 **무엇이 빠졌는가**다. 유사도 92%만 보여 주면 담당자가 신뢰할 근거가 없고, 필터에 걸려 빠진 문서를 말하지 않으면 '없다'로 읽힌다 — 있는데 안 보여 준 것뿐인데.
    BackTranslationCheck:
      type: object
      properties:
        segmentId:
          type: number
        backText:
          type: string
          description: 번역문을 원문 언어로 되돌린 결과
        similarity:
          type: number
          description: 원문과의 의미 일치도 0~1
      required:
        - segmentId
        - backText
        - similarity
      additionalProperties: false
    BatchAddressResult:
      type: object
      properties:
        mode:
          type: string
          const: address-batch
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BatchAddressRow"
        elapsedSeconds:
          type: number
      required:
        - mode
        - rows
        - elapsedSeconds
      additionalProperties: false
    BatchAddressRow:
      type: object
      properties:
        id:
          type: string
        input:
          type: string
        resolved:
          $ref: "#/components/schemas/AddressResolution"
      required:
        - id
        - input
        - resolved
      additionalProperties: false
    Benchmark:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        measures:
          type: string
          description: 무엇을 재는가
        relevance:
          type: string
          enum:
            - close
            - partial
            - far
          description: 우리 업무와 얼마나 가까운가 — 화면이 이걸 먼저 말한다
        relevanceNote:
          type: string
          description: 왜 그렇게 보는가
      required:
        - id
        - name
        - measures
        - relevance
        - relevanceNote
      additionalProperties: false
    BenchmarkRun:
      type: object
      properties:
        id:
          type: string
        benchmarkId:
          type: string
        modelName:
          type: string
        modelVersion:
          type: string
        score:
          type: number
        samples:
          type: number
        elapsed:
          type: string
        state:
          type: string
