    HealthLevel:
      type: string
      enum:
        - ok
        - warn
        - down
      description: |-
        관리자 대시보드가 다루는 것들 — 클러스터·서비스·GPU·학습 작업.
        
        ⚠️ **이 값들은 서버가 붙기 전까지 전부 예시다.** 다른 화면의 fixture는 업무 로직을 보여 주지만(요약이 어떻게 나오는가), 인프라 수치는 로직이 없다. 숫자 자체가 전부다. 그래서 지어낸 값을 실측처럼 그리면 **거짓 계기판**이 된다. 화면이 반드시 '서버 미연결 — 예시 값'을 먼저 말한다(SCOPE-PLAN §3-7).
        
        상태는 코드로 받는다. `'Healthy'` 같은 표시 문자열이나 색은 서버가 주지 않는다.
    HexColor:
      type: string
      description: 브랜드 색 — 화면이 CSS 변수로 푼다. 여기서는 값만 보관한다.
    HrChange:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/HrChangeKind"
        dept:
          type: string
        syncedOn:
          type: string
        effect:
          type: string
          description: 이 변경으로 계정에 무슨 일이 있었는가
        failedReason:
          type:
            - string
            - "null"
          description: 처리에 실패했으면 이유. 성공이면 null
      required:
        - id
        - name
        - kind
        - dept
        - syncedOn
        - effect
        - failedReason
      additionalProperties: false
    HrChangeKind:
      type: string
      enum:
        - join
        - leave
        - move
        - concurrent
        - absence
      description: |-
        HR 연계 · API · 외부 연동.
        
        ⚠️ **API 키는 이 모델에 없다.** 발급 시 한 번만 보여 주고 그 뒤로는 서버도 원문을 갖지 않는 것이 맞다. 관리 화면에 키를 늘어놓으면 화면을 여는 사람 모두가 모든 키를 갖게 된다 — 목록에 있으면 언젠가 캡처되고 공유된다.
        
        HR 동기화는 **계정을 만들고 없애는 일**이다. 퇴직 처리가 밀리면 접속이 열린 채로 남는다. 그래서 '몇 건 처리했다'가 아니라 **못 처리한 것과 밀린 시간**을 드러낸다.
