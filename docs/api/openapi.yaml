          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workflows/{id}:
    patch:
      operationId: setWorkflowEnabled
      summary: 켜기·끄기
      description: 켜기·끄기
      tags:
        - workflows
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
