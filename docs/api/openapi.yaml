  /scenarios:
    get:
      operationId: fetchScenarioDefs
      summary: 단계마다 어느 에이전트를 부르는지
      description: → `ScenarioDefinition[]`. 단계마다 어느 에이전트를 부르는지
      tags:
        - scenarios
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
