        - lastSyncAt
        - nextSyncAt
        - totalUsers
        - changes
      additionalProperties: false
    ImpactVerdict:
      type: string
      enum:
        - high
        - reviewing
        - notHigh
      description: 고영향 AI 판정
    IndexEntry:
