        - rows
        - columns
        - sizeBytes
        - source
      additionalProperties: false
    DatasetFormat:
      type: string
      enum:
        - csv
        - xlsx
      description: |-
        분석 데이터셋 모델.
        
        공정 데이터 분석의 입력은 업무 문서가 아니다. 작업표준서 PDF를 골라 불량률 추이를 낼 수는 없다. 처음에는 문서 목록을 그대로 썼는데, 기존 데모와 대조하다 그 부조리가 드러났다 — 원래 입력은 `침탄로3호기_온도프로파일.csv (12,960행)` 같은 데이터 파일이다.
        
        ⚠️ 표시 문자열을 넣지 않는다. 행 수는 `12960`이고 `'12,960행'`은 화면이 만든다.
    DatasetKind:
      type: string
      enum:
        - train
        - eval
        - both
      description: |-
        데이터 · 개발 환경 · 모델 · 학습 · 평가.
        
        ⚠️ P4는 **전부 인프라 수치**다. 업무 로직이 없어 숫자 자체가 전부이므로 모든 화면이 `서버 미연결 — 예시 값` 배지를 단다(SCOPE-PLAN §3-7).
        
        이 구역에서 가장 위험한 것 둘:  ① **계보가 끊긴 모델** — 운영 중인데 무슨 데이터로 학습했는지 모른다.     개인정보 삭제 요청이 오면 어느 모델을 다시 학습해야 하는지 답할 수 없다.  ② **평가셋이 학습셋과 겹침** — 점수가 부풀려진다. 높은 점수를 보고 배포한다. 둘 다 오류가 나지 않으므로 화면이 말하지 않으면 아무도 모른다.
    Decision:
