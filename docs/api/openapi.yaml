      description: |-
        워크스페이스 — 대화를 업무 단위로 나눈다.
        
        이전 데모에는 사이드바에 이름만 있고 눌러도 아무 일이 없었다. 이름만 옮기면 기능이 있는 것처럼 보이기만 하므로, **대화를 실제로 나누게** 만든다. 고른 워크스페이스의 대화만 목록에 남는다.
