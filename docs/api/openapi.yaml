# 자동 생성물 — 손으로 고치지 마십시오.
# 생성: node scripts/build-openapi.mjs
# 원본: docs/API-PROPOSAL.md §2 표 + src/entities/*/model.ts
openapi: "3.1.0"
info:
  title: AgentQ API (프론트 제안)
  version: "0.1.0-proposal"
  description: |-
    이 명세는 **프론트가 제안한 것**이다. 백엔드가 다르게 정하면 그쪽을 따른다(DECISIONS.md D-010).
    
    - 스키마는 손으로 적지 않았다. `src/entities/*/model.ts`에서 뽑았고 그 파일이 정본이다.
    - 인증·테넌시·권한은 아직 비어 있다. 프론트가 정할 일이 아니라서다 — API-PROPOSAL.md §5 참조.
    - 재생성: `node scripts/build-openapi.mjs`
servers:
  -
    url: /api
    description: 미정 — 백엔드가 정한다
paths:
  /domains:
    get:
      operationId: fetchDomains
      summary: GET /domains
      description: → `Domain[]` (`entities/domain/model.ts`)
      tags:
        - domains
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /domains/{id}:
    get:
      operationId: fetchDomain
      summary: GET /domains/{id}
      description: → `Domain`
      tags:
        - domains
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /workspaces:
    get:
      operationId: fetchWorkspaces
      summary: GET /workspaces
      description: → `Workspace[]` (`entities/workspace/model.ts`)
      tags:
        - workspaces
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /notices:
    get:
      operationId: fetchNotices
      summary: GET /notices
      description: → `Notice[]` (`entities/notice/model.ts`)
      tags:
        - notices
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-clients:
        - fetchNotices
        - fetchManagedNotices
    post:
      operationId: saveNotice
      summary: 공지 등록
      description: 공지 등록
      tags:
        - notices
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /documents:
    get:
      operationId: fetchDocuments
      summary: GET /documents
      description: "`?kind=sop\\|report\\|certificate\\|minutes` → `BusinessDocument[]` (`entities/document/model.ts`)"
      tags:
        - documents
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessDocument"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: uploadDocument
      summary: 파일
      description: 파일 → `BusinessDocument`
      tags:
        - documents
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
  /compliance/evidence:
    get:
      operationId: fetchEvidence
      summary: "책무마다 **기록이 어디에 남는지** — '이행했다'와 '증명할 수 있다'는 다르다"
      description: "→ `EvidenceItem[]` (`entities/evidence/model.ts`). 책무마다 **기록이 어디에 남는지** — '이행했다'와 '증명할 수 있다'는 다르다"
      tags:
        - compliance
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceItem"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /tools/servers:
    get:
      operationId: fetchMcpServers
      summary: "**주소·토큰은 응답에 넣지 않는다** — §2-9와 같은 이유"
      description: → `McpServer[]`. **주소·토큰은 응답에 넣지 않는다** — §2-9와 같은 이유
      tags:
        - tools
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpServer"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /volumes:
    get:
      operationId: fetchVolumes
      summary: GET /volumes
      description: → `Volume[]`
      tags:
        - volumes
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Volume"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /volumes/{id}:
    delete:
      operationId: releaseVolume
      summary: 볼륨 비우기
      description: 볼륨 비우기
      tags:
        - volumes
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /vector/collections:
    get:
      operationId: fetchCollections
      summary: "**차원과 임베딩 모델을 함께** — 다르면 같은 검색에서 못 섞는다"
      description: → `VectorCollection[]` (`entities/datainfra/model.ts`). **차원과 임베딩 모델을 함께** — 다르면 같은 검색에서 못 섞는다
      tags:
        - vector
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VectorCollection"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ingest/sources:
    get:
      operationId: fetchIngestSources
      summary: 마지막 실행 성공 여부와 **가져온 건수**를 함께 — 성공 표시만으로는 0건을 못 잡는다
      description: → `IngestSource[]`. 마지막 실행 성공 여부와 **가져온 건수**를 함께 — 성공 표시만으로는 0건을 못 잡는다
      tags:
        - ingest
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestSource"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ingest/sources/{id}:run:
    post:
      operationId: runIngest
      summary: 수동 수집
      description: 수동 수집
      tags:
        - ingest
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
  /benchmarks:
    get:
      operationId: fetchBenchmarks
      summary: "**업무 근접도를 함께** — 점수만 오면 위키 독해 잘하는 모델을 사내 QA용으로 고르게 된다"
      description: → `Benchmark[]`. **업무 근접도(`relevance`)를 함께** — 점수만 오면 위키 독해 잘하는 모델을 사내 QA용으로 고르게 된다
      tags:
        - benchmarks
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Benchmark"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /benchmarks/runs:
    get:
      operationId: fetchBenchmarkRuns
      summary: GET /benchmarks/runs
      description: → `BenchmarkRun[]`
      tags:
        - benchmarks
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenchmarkRun"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/instances:
    get:
      operationId: fetchAppInstances
      summary: 내려간 앱은 사유 필수
      description: → `AppInstance[]` (`entities/appinst/model.ts`). 내려간 앱은 사유(`downReason`) 필수
      tags:
        - apps
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppInstance"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /apps/instances/{id}:
    patch:
      operationId: setInstanceLive
      summary: 앱 올리기·내리기
      description: 앱 올리기·내리기
      tags:
        - apps
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
