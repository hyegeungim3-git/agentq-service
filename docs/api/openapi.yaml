        표준 보고서 작성 모델.
        
        보고서는 '문장을 잘 쓰는 것'이 아니라 **정해진 양식의 칸을 근거 있는 값으로 채우는 것**이다. 그래서 결과는 자유 텍스트가 아니라 절(section) 배열이고, 각 절은 어느 데이터에서 왔는지(source)를 달고 있다.
        
        사람이 직접 넣어야 하는 칸(주요 실적·다음 계획·특이 사항)은 비워 두면 자동으로 채우지 않고 '확인 필요'로 남긴다. 그럴듯한 문장으로 메우면 결재선에서 그게 실적인 줄 안다.
