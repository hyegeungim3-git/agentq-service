        confidence:
          type: number
          description: "0~1. 낮으면 사람이 봐야 한다"
        translated:
          type: boolean
          description: 번역이 된 문장인가. 직접 입력한 임의 문장은 엔진 없이 번역할 수 없다 — 그럴듯한 결과를 만드는 대신 안 됐다고 표시한다.
