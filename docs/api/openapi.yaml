        limit:
          type:
            - number
            - "null"
          description: 월 한도. 없으면 null
      required:
        - id
        - label
        - used
        - limit
      additionalProperties: false
      description: 소비량 — 한도 대비 얼마나 썼는지
    UsageEntry:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        userName:
          type: string
        dept:
          type: string
        mode:
          $ref: "#/components/schemas/UsageMode"
        tokens:
          type: number
        rating:
          type:
            - number
            - "null"
          description: 사용자가 만족도를 남겼으면 1~5. 안 남겼으면 null
        reported:
          type: boolean
          description: 오류로 신고된 건
      required:
        - id
        - at
        - userName
        - dept
        - mode
        - tokens
        - rating
        - reported
      additionalProperties: false
    UsageMode:
      type: string
      enum:
        - general
        - review
        - translate
        - report
        - agent
        - secure
      description: |-
        서비스 분석 — 이용 이력·만족도·통계·리포트.
        
        이 구역의 위험은 **표본이 무엇인지 밝히지 않는 것**이다. '평균 만족도 4.2점'은 누가 답한 4.2인지 없으면 뜻이 없다. 응답률이 68%면 그 4.2는 답한 사람만의 평균이고, 답하지 않은 32%는 아무 말도 하지 않았다.
        
        ⚠️ **질의 본문은 여기 없다.** 접근 로그 화면이 '챗봇 질문 본문은 남기지 않는다'고 말하고 있으므로 이 화면도 같아야 한다. 두 화면이 다른 말을 하면 어느 쪽이 사실인지 알 수 없다. 보관 여부는 백엔드가 정한다(API-PROPOSAL §3).
    UsageStats:
      type: object
      properties:
        window:
          $ref: "#/components/schemas/StatWindow"
        totalQueries:
          type: number
        activeUsers:
          type: number
        avgSeconds:
          type: number
          description: 초 단위. 성공한 요청만 센 값이다
        failedQueries:
          type: number
          description: 실패해서 평균에서 빠진 건수
        daily:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              queries:
                type: number
              users:
                type: number
            required:
              - date
              - queries
              - users
            additionalProperties: false
        byMode:
          type: array
          items:
            type: object
            properties:
              mode:
                $ref: "#/components/schemas/UsageMode"
              queries:
                type: number
            required:
              - mode
              - queries
            additionalProperties: false
      required:
