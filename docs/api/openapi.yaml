        코드는 **발주처가 정한다.** 예전에는 다섯 개를 여기 못박아 두고 라벨까지 들고 있었는데, 그 라벨이 '품질경영매뉴얼'처럼 제조 전용이었다 — 두 번째 발주처를 열자마자 드러났다. 이름은 팩이 주고, 여기서는 **묶음이 있다는 사실**만 다룬다.
