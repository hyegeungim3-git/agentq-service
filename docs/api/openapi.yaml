        - source
        - sourceSystem
        - suggested
        - standardName
        - confidence
        - status
        - basis
        - alternatives
        - blocker
      additionalProperties: false
    MappingMode:
      type: string
      enum:
        - tags
        - address-single
        - address-batch
        - address-ocr
        - code-lookup
      description: |-
        처리 유형. 설비 태그와 주소는 다루는 대상이 다르지만
        **판정 3분류(auto·review·none)는 그대로 공유한다** — 어디까지가 자동인지 나누는 것이 이 에이전트의 값어치이고, 그건 대상이 달라도 같다.
    MappingRequest:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/MappingMode"
        query:
          type: string
          description: 단일 주소·코드 역조회의 입력
        batchText:
          type: string
          description: 일괄 처리 입력 — 줄바꿈으로 구분
        documentName:
          type: string
          description: OCR 대상 문서 이름
      required:
        - mode
        - query
        - batchText
        - documentName
      additionalProperties: false
      description: |-
        표준화 요청.
        
        다른 에이전트의 요청 타입과 마찬가지로 **엔티티가 갖는다.** 경계 파일(`shared/api`)에 두면 계약 타입이 화면 코드와 같은 층에 섞이고, 명세를 뽑을 때 한 곳에서 못 찾는다 — 실제로 OpenAPI 생성이 이것만 놓쳤다.
    MappingResult:
      anyOf:
        -
          $ref: "#/components/schemas/TagMappingResult"
        -
          $ref: "#/components/schemas/SingleAddressResult"
        -
          $ref: "#/components/schemas/BatchAddressResult"
        -
          $ref: "#/components/schemas/OcrAddressResult"
        -
          $ref: "#/components/schemas/CodeLookupResult"
    MappingStatus:
      type: string
      enum:
        - auto
        - review
        - none
      description: |-
        기준정보 표준화 모델.
        
        이 화면의 값어치는 '자동으로 다 해 준다'가 아니라 **어디까지가 자동이고 어디부터 사람이 판단해야 하는지 나누는 것**이다.
        
        그래서 후보마다 판정 상태를 셋으로 나눈다:   auto   신뢰도가 높아 자동 확정 가능   review 근거는 있으나 사람이 골라야 함 (후보가 둘 이상이거나 단위 환산이 필요)   none   AI가 해결할 수 없음 — 설비 교체·양식 개선 같은 현장 조치가 필요
        
        none을 review에 섞으면 '검토만 하면 다 된다'는 착각을 만든다.
    MaskEntry:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/PiiKind"
        original:
          type: string
        masked:
          type: string
        lineIndex:
