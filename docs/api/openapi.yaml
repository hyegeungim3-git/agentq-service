        - target
        - enabled
        - how
      additionalProperties: false
    LanguageCode:
      type: string
      enum:
        - ko
        - en
        - ja
        - zh
      description: |-
        문서 번역 모델.
        
        제조 수출 문서(검사성적서·작업표준)를 대상으로 한다. 번역 자체보다
        **용어집 일치**와 **역번역 검증**이 실무의 관심사다 — 규격 용어가 흔들리면 해외 고객 검수에서 반려된다.
    LiveMetric:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        unit:
          type: string
        threshold:
          type: number
          description: 관리 기준 — 넘으면 조치가 필요하다
        overAdvice:
          type: string
          description: |-
            넘었을 때 무엇을 하라고 할 것인가.
            
            코어에 '운전을 계속하지 말고 보전 진단을 받으십시오'를 박아 뒀더니 병원 응급실 지표에도 그 문장이 떴다. 조치는 발주처 업무의 말이다.
        curve:
          type: array
          items:
            type: number
          description: 재생할 예시 곡선. 초 단위 간격으로 이어진다
        stepSeconds:
          type: number
          description: 곡선 한 점이 나타내는 실제 시간(초)
        source:
          type: string
      required:
        - id
        - label
        - unit
        - threshold
        - overAdvice
        - curve
        - stepSeconds
        - source
      additionalProperties: false
    MapIntel:
      type: object
      properties:
        siteLabel:
          type: string
          description: |-
            무엇을 늘어놓는가 — 공장은 사업장, 병원은 진료과, 시청은 행정동이다.
            
            코어에 '사업장'을 박아 뒀더니 병원 화면에 `사업장별 병상 가동률`이 떴다. 지도는 발주처마다 다른 것을 세는 그림이라 세는 단위도 발주처가 정한다.
        metricLabel:
          type: string
        unit:
          type: string
        period:
          type: string
        lowerIsWorse:
          type: boolean
          description: 낮으면 조치가 필요한 지표인지 — 색과 문구의 방향이 반대가 된다
        threshold:
          type: number
        sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteMetric"
      required:
        - siteLabel
        - metricLabel
        - unit
        - period
        - lowerIsWorse
        - threshold
        - sites
      additionalProperties: false
    MappingBasis:
      type: object
      properties:
        label:
          type: string
        detail:
          type: string
      required:
        - label
        - detail
      additionalProperties: false
    MappingCandidate:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          description: 원본 태그 — 현장에서 쓰던 표기
        sourceSystem:
          type: string
        suggested:
          type: string
          description: "제안 표준 코드. 없으면 '-'"
        standardName:
          type: string
        confidence:
          type: number
          description: "0~1"
        status:
          $ref: "#/components/schemas/MappingStatus"
        basis:
          type: array
          items:
            $ref: "#/components/schemas/MappingBasis"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
        blocker:
          type:
            - string
            - "null"
          description: 표준화하려면 무엇이 바뀌어야 하는지 (status가 none일 때)
      required:
