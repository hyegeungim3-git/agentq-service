            type: string
  /analysis/datasets:
    get:
      operationId: fetchDatasets
      summary: 분석에 넣는 **데이터 파일**이다 — 학습·평가 데이터셋과 다른 자원
      description: → `Dataset[]` (`entities/dataset/model.ts`). 분석에 넣는 **데이터 파일**이다 — 학습·평가 데이터셋(`GET /datasets`)과 다른 자원
      tags:
        - analysis
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dataset"
