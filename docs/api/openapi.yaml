      type: string
      description: |-
        조회할 데이터 소스.
        
        코드도 이름도 **발주처가 정한다.** 예전에는 '설비 대장·자재 재고·생산 실적'을 여기 못박아 뒀는데, 그건 제조 전용이었다 — 두 번째 발주처를 열자 드러났다.
