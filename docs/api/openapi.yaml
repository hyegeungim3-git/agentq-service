          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/IndexState"
        reason:
          type:
            - string
            - "null"
          description: 색인되지 않았으면 왜인지. 색인됐으면 null
        updatedOn:
          type: string
      required:
