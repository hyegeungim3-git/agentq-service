      operationId: fetchReviewSets
      summary: "**묶음 이름도 발주처가 정한다** — '품질경영매뉴얼'은 제조 전용이었다"
      description: "→ `RegulationSetOption[]` (`entities/review/model.ts`). **묶음 이름도 발주처가 정한다** — '품질경영매뉴얼'은 제조 전용이었다"
      tags:
        - reviews
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegulationSetOption"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reviews:
    post:
      operationId: createReview
      summary: POST /reviews
      description: "`ReviewRequest` → `ReviewResult` (`entities/review/model.ts`)"
      tags:
        - reviews
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        default:
          description: 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
