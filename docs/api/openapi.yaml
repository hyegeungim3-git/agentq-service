            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /scenarios/{id}:
    put:
      operationId: saveScenario
      summary: 시나리오 변경
      description: 시나리오 변경
      tags:
        - scenarios
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                description: 응답 형태 미정 — 제안서 본문 참조
        default:
          description: 오류
          content:
