      type: string
      enum:
        - documents
        - agentContent
        - scenarios
        - mapIntel
        - signals
        - branding
      description: |-
        도메인 팩 · 도구/배포.
        
        **팩이 준비돼야 포털에서 고를 수 있다.** 애플리케이션 화면의 '발주처별 노출'과 같은 사실을 반대쪽에서 본다 — 저기는 결과(0종), 여기는 이유(무엇이 비었나).
        
        ⚠️ 채움 비율만 보여 주면 안 된다. '40% 준비'는 무엇을 더 해야 하는지 알려 주지 않는다. **비어 있는 항목을 이름으로** 말한다.
        
        도구는 끊겨도 서비스가 죽지 않는다 — 그 도구를 쓰는 에이전트만 조용히 못 돈다. 그래서 **끊기면 어떤 에이전트가 멈추는지**를 함께 둔다.
