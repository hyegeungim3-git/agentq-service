      additionalProperties: false
    NodeKind:
      type: string
      enum:
        - trigger
        - agent
        - branch
        - tool
        - review
        - action
      description: |-
        워크플로우 — 조건 분기가 있는 멀티 에이전트 흐름.
        
        시나리오 빌더와 다르다. 시나리오는 **선형 릴레이**(1→2→3→4)이고, 워크플로우는 **분기가 있는 그래프**다(조건에 따라 다른 길로 간다).
        
        ⚠️ 분기가 있으면 **어느 길로 갔는지 모른 채 결과만 보게 된다.** 같은 입력에 다른 결과가 나와도 왜인지 알 수 없다. 그래서 실행 이력에 **탄 분기**를 남기고, 한 번도 안 탄 분기를 드러낸다 — 안 타는 분기는 죽은 길이거나 조건이 틀린 것이다.
