        - masked
        - warned
      description: |-
        가드레일 차단 이력과 AI 기본법 대응.
        
        ⚠️ **이 화면들은 법적 판단을 내리지 않는다.** 고영향 AI 해당 여부는 사업자가 판단하고 필요하면 소관 부처에 확인한다. 화면은 그 판단과 근거를 **기록**할 뿐이다. 화면이 판정을 내리는 것처럼 보이면, 화면에 '비해당'이라고 떴다는 이유로 의무를 넘기게 된다.
        
        가드레일 규칙 자체(켜기·끄기)는 신뢰성 관리에서 다룬다. 여기는 **실제로 무엇이 걸렸는지**다. 같은 목록을 두 화면에 두면 어느 쪽이 진짜인지 알 수 없다.
