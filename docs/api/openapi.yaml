        규정 조회의 값어치는 답변 문장이 아니라 **어느 조항에 근거했는가**다. 근거 없는 답은 실무에서 쓸 수 없으므로, 인용 없는 답변이 나오지 않도록 결과에 citations를 필수로 둔다.
