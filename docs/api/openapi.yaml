    CollectionState:
      type: string
      enum:
        - active
        - building
        - stale
      description: |-
        벡터 DB · 자동 적재 · 벤치마크.
        
        세 화면 모두 인프라 수치라 `서버 미연결 — 예시 값` 배지를 단다.
        
        각 화면이 숨기면 안 되는 것:  ① 벡터 DB — **차원이 다른 컬렉션**은 같은 검색에서 비교할 수 없다. 임베딩     모델이 다르기 때문인데, 목록만 보면 그냥 나란한 컬렉션으로 보인다.  ② 자동 적재 — 스케줄이 '정상'인데 **마지막 수집이 실패**했을 수 있다.     스케줄은 돌고 있고 가져온 것만 0건이면 아무도 모른다.  ③ 벤치마크 — **점수가 높다고 우리 업무를 잘한다는 뜻이 아니다.** MTEB·KorQuAD는     공개 데이터로 잰 것이고, 사내 문서 QA는 다른 것이다.
    ConfidencePolicy:
      type: object
      properties:
        autoAnswerThreshold:
          type: number
        belowAction:
          type: string
          description: 임계값 아래일 때 하는 일
      required:
        - autoAnswerThreshold
        - belowAction
      additionalProperties: false
      description: |-
        자동 응답 임계값.
        
        이 값 아래면 사람이 확인하도록 넘긴다. 값만 보여 주면 무슨 뜻인지 알 수 없어 화면이 '넘겼을 때 어떻게 되는지'를 함께 말한다.
