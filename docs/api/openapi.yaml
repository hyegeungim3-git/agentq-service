        - title
        - state
        - reason
        - updatedOn
      additionalProperties: false
    IndexState:
      type: string
      enum:
        - indexed
        - pending
        - failed
        - skipped
      description: |-
        지식 관리 — 지식영역·색인·검색 설정.
        
        ⚠️ 이 화면의 위험은 **목록에 있는데 검색에 안 잡히는 문서**다. 관리자는 '문서 240건 등록'을 보고 다 찾을 수 있다고 믿는데, 색인이 안 됐거나 실패한 문서는 사용자에게 '없다'고 답한다. 사용자는 그걸 구분할 방법이 없다.
        
        그래서 등록 건수와 **찾을 수 있는 건수를 따로 센다.**
        
        임베딩 모델을 바꾸면 전체 재색인이 필요하다. 안 하면 옛 벡터와 새 벡터가 섞여 검색이 조용히 나빠진다 — 오류가 안 나서 더 늦게 발견된다.
    IngestMethod:
