          description: 조건에 맞았지만 상위 N에 잘린 건수
        excludedBySecurity:
          type: number
          description: "보안 등급 필터에 걸려 빠진 건수 — 감추면 '없다'로 읽힌다"
        excludedByScope:
          type: number
