          $ref: "#/components/schemas/DatasetFormat"
        rows:
          type: number
          description: 데이터 행 수 — 헤더 제외
        columns:
          type: number
        sizeBytes:
          type: number
        source:
          type: string
          description: 어느 시스템에서 나왔는지. 같은 지표라도 출처가 다르면 해석이 달라진다
      required:
