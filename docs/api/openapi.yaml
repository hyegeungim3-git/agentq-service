        - totalQueries
        - activeUsers
        - avgSeconds
        - failedQueries
        - daily
        - byMode
      additionalProperties: false
    UserRole:
      type: string
      enum:
        - member
        - manager
        - admin
      description: |-
        플랫폼 사용자 — 계정·승인·할당량·접근 기록·차단.
        
        ⚠️ **권한 규칙은 프론트가 정하지 않는다**(SCOPE-PLAN §4, API-PROPOSAL §3). 누가 무엇을 할 수 있는지는 서버가 판정해 `permissions`로 내려 주고, 화면은 그 값을 그리기만 한다. 화면에 규칙을 하드코딩하면 서버 규칙과 어긋나는 순간 **화면에서는 되는데 서버가 막는** 상태가 된다.
        
        상태·역할은 코드로 받는다. 표시 문자열과 색은 화면이 정한다.
    UserState:
      type: string
      enum:
