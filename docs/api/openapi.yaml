        ⚠️ 지리 좌표가 아니라 **배치 도식**이다. 실제 지도 위에 찍으면 위치가 맞아야 하는데 그 데이터가 없다. 격자 위치만 두고 화면이 '도식'이라고 말한다. 지도처럼 보이는데 위치가 틀리면 그게 제일 위험하다.
        
        값이 없는 사업장을 빼지 않는다. 빼면 '전 사업장이 이렇다'로 읽힌다 — 빈칸으로 두고 왜 없는지 말한다.
